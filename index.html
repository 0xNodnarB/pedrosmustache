<title>pedrosmustache.com</title>
<meta name="description" content="A mustachioed man and his pickle, undated.">
<meta property="og:title" content="pedrosmustache.com">
<meta property="og:description" content="A mustachioed man and his pickle, undated.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@1,6..72,300;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root {
    --brine:   #14210f;
    --brine-2: #1d2e16;
    --pickle:  #86b33c;
    --wall:    #efe8d8;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--brine);
    background-image: radial-gradient(120% 80% at 50% 18%, var(--brine-2) 0%, var(--brine) 62%);
    color: var(--wall);
    font-family: "Newsreader", Georgia, "Times New Roman", serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(16px, 4vw, 48px);
  }

  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(18px, 3.2vh, 34px);
    max-width: 100%;
  }

  .portrait {
    display: block;
    max-height: 78vh;
    max-width: 100%;
    width: auto;
    height: auto;
    box-shadow:
      0 1px 0 rgba(134, 179, 60, 0.35),
      0 24px 60px -18px rgba(0, 0, 0, 0.85);
  }

  .caption {
    margin: 0;
    font-style: italic;
    font-weight: 300;
    font-size: clamp(1rem, 2vw, 1.3rem);
    line-height: 1.45;
    letter-spacing: 0.01em;
    text-align: center;
    text-wrap: balance;
    max-width: 42ch;
    color: var(--wall);
    opacity: 0.82;
  }

  /* One orchestrated entrance, nothing else moves. */
  main {
    animation: arrive 900ms cubic-bezier(0.2, 0.7, 0.3, 1) both;
  }

  @keyframes arrive {
    from { opacity: 0; transform: translateY(10px) scale(0.992); }
    to   { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    main { animation: none; }
  }

  @media (max-width: 560px) {
    .portrait { max-height: 72vh; }
  }
</style>
